name = "taskflowy"
main = "src/index.tsx"
compatibility_date = "2024-01-17"

# Access (Zero Trust) fronts the custom domain; keep the unprotected
# workers.dev route disabled so it is the only way in.
workers_dev = false
routes = [
  { pattern = "task.chroju.dev", custom_domain = true }
]

[assets]
directory = "./public"

[[kv_namespaces]]
binding = "KV"
id = "275f4b9656744cc18d9de514e1596426"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://task.chroju.dev"
